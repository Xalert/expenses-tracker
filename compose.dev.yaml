# Development database: `npm run db:up` / `npm run db:down`. Not the deployment file (see deploy/compose.yaml).
# The named volume holds the data of `npm run dev` (database `expenses`); `npm run dev:demo` uses `expenses_demo`,
# created by scripts/dev-db-init.sql the first time the volume is initialised. `db:down` keeps the volume.
name: expenses-tracker-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
      POSTGRES_DB: expenses
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - expenses-dev-pg:/var/lib/postgresql/data
      - ./scripts/dev-db-init.sql:/docker-entrypoint-initdb.d/10-demo-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  expenses-dev-pg:
